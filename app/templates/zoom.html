<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  {{ theme.font_face_css | safe }}
  @page { size: {{ width }}px {{ height }}px; margin: 0; }
  :root {
    --font-family: {{ theme.font_family_css | safe }};
    --font-scale: {{ theme.font_scale * zoom_factor }};
    --border: {{ theme.border }};
    --divider: {{ theme.divider }};
    --cell-padding: {{ theme.cell_padding }};
  }
  html, body { margin: 0; padding: 0; width: {{ width }}px; height: {{ height }}px;
               font-family: var(--font-family); color: #000;
               position: relative; overflow: hidden; }
  .zoom-body { width: {{ width }}px; height: {{ body_h }}px;
               padding: 16px; box-sizing: border-box; overflow: hidden; }
  .back-strip { position: absolute; left: 0; bottom: 0; box-sizing: border-box;
                width: {{ width }}px; height: {{ strip_h }}px;
                border-top: 2px solid #000;
                display: flex; align-items: center; justify-content: center;
                font-size: 32px; font-weight: 700; }
  {% include "_widgets.css" %}
</style>
</head>
<body>
  <div class="zoom-body">
    {% if error %}<div class="widget widget-error">&#9888; {{ error }}</div>{% else %}{{ body | safe }}{% endif %}
  </div>
  <div class="back-strip">&larr; back</div>
</body>
</html>
